name: build

on:
  workflow_dispatch:          # Actions タブのボタンで手動実行
  push:
    tags:
      - 'v*'                # v0.1.0 などのタグでリリース作成

jobs:
  freeze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: gecko-windows.zip
          - os: macos-latest
            asset: gecko-macos.zip
          - os: ubuntu-latest
            asset: gecko-linux.zip
    runs-on: ${{ matrix.os }}
    env:
      GECKO_CLI: "1"        # CI では待機(pause)しない
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Freeze (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onedir --name gecko --add-data "jp.py;." gek_runner.py

      - name: Freeze (macOS / Linux)
        if: runner.os != 'Windows'
        run: pyinstaller --onedir --name gecko --add-data "jp.py:." gek_runner.py

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: dist\gecko\gecko.exe sample.gek

      - name: Smoke test (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/gecko/gecko
          dist/gecko/gecko sample.gek

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        run: |
          copy gek-click.bat dist\gecko\
          Compress-Archive -Path dist\gecko -DestinationPath ${{ matrix.asset }}

      - name: Pack (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/gecko/gecko
          (cd dist && zip -qr ../${{ matrix.asset }} gecko)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gecko-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gecko-windows.zip
            gecko-macos.zip
            gecko-linux.zip
