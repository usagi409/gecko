name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  freeze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: gecko-windows-portable.zip
          - os: macos-latest
            asset: gecko-macos.zip
          - os: ubuntu-latest
            asset: gecko-linux.zip
    runs-on: ${{ matrix.os }}
    env:
      GECKO_CLI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Freeze (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onedir --name gecko --add-data "jp.py;." gek_runner.py

      - name: Freeze (macOS / Linux)
        if: runner.os != 'Windows'
        run: pyinstaller --onedir --name gecko --add-data "jp.py:." gek_runner.py

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: dist\gecko\gecko.exe sample.gek

      - name: Smoke test (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/gecko/gecko
          dist/gecko/gecko sample.gek

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        run: |
          copy gek-click.bat dist\gecko\
          copy README-portable.txt dist\gecko\README.txt
          Compress-Archive -Path dist\gecko -DestinationPath ${{ matrix.asset }}

      - name: Pack (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/gecko/gecko
          cp README-portable.txt dist/gecko/README.txt
          (cd dist && zip -qr ../${{ matrix.asset }} gecko)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  installer:
    needs: freeze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gecko-windows-portable.zip

      - name: Unzip
        run: Expand-Archive gecko-windows-portable.zip -DestinationPath dist

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        run: |
          $ver = "dev"
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$ver gecko.iss

      - uses: actions/upload-artifact@v4
        with:
          name: gecko-installer
          path: Output\gecko-setup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [freeze, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gecko-*
          merge-multiple: true

      - name: List files
        run: ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gecko-windows-portable.zip
            gecko-macos.zip
            gecko-linux.zip
            gecko-setup-*.exe
